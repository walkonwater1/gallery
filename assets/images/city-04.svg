    <linearGradient id="cyan" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#63d1d4" stop-opacity="0"/><stop offset=".35" stop-color="#63d1d4" stop-opacity=".8"/><stop offset="1" stop-color="#63d1d4" stop-opacity=".05"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#ffb572" stop-opacity="0"/><stop offset=".4" stop-color="#ffb572" stop-opacity=".8"/><stop offset="1" stop-color="#ffb572" stop-opacity=".05"/></linearGradient>
    <linearGradient id="pink" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e78aa2" stop-opacity="0"/><stop offset=".45" stop-color="#e78aa2" stop-opacity=".6"/><stop offset="1" stop-color="#e78aa2" stop-opacity=".03"/></linearGradient>
    
  </defs>
  
  <rect width="1200" height="1500" fill="url(#bg)"/>
  <g opacity=".8" filter="url(#blur14)">
    <rect x="130" y="120" width="95" height="900" fill="url(#cyan)"/>
    <rect x="260" y="60" width="28" height="820" fill="url(#amber)"/>
    <rect x="430" y="180" width="60" height="950" fill="url(#pink)"/>
