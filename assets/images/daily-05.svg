    <linearGradient id="sun" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff4d5" stop-opacity=".9"/><stop offset="1" stop-color="#fff4d5" stop-opacity="0"/></linearGradient>
    
  </defs>
  
  <rect width="1200" height="1500" fill="url(#room)"/>
  <path d="M0 0 H650 L1200 900 V0Z" fill="url(#sun)" opacity=".55"/>
