    <linearGradient id="curtain" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f5ead6" stop-opacity=".95"/><stop offset=".2" stop-color="#e1d0b5" stop-opacity=".75"/>
      <stop offset=".45" stop-color="#fbf4e6" stop-opacity=".92"/><stop offset=".7" stop-color="#dcc7a8" stop-opacity=".65"/>
