# 水上行走画册 · H618 / Armbian Nginx 站点配置
#
# 安装位置：
#   /etc/nginx/sites-available/album
#
# 启用：
#   sudo ln -sf /etc/nginx/sites-available/album /etc/nginx/sites-enabled/album
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /srv/digital_album;
    index index.html;
    charset utf-8;

    # 不生成目录列表
    autoindex off;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # 网页上的管理操作（封面 / 隐藏照片），转发到本机 album-api 服务
    location ^~ /api/ {
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_connect_timeout 10s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # HTML 每次都向服务器校验，避免重新生成后仍看到旧封面
    location ~* \.html$ {
        try_files $uri =404;
        add_header Cache-Control "no-cache, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
    }

    # 静态资源缓存；deploy.py 会给 css/js 加版本号破缓存
    location ~* \.(?:css|js|mjs|svg|jpg|jpeg|png|webp|avif|gif|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
