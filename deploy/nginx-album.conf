# 拾光画册 · H618 / Armbian Nginx 站点配置
#
# 安装位置：
#   /etc/nginx/sites-available/album
#
# 启用：
#   sudo ln -sf /etc/nginx/sites-available/album /etc/nginx/sites-enabled/album
#   sudo nginx -t && sudo systemctl reload nginx

server {
    listen 8080;
    listen [::]:8080;
    server_name _;

    root /srv/digital_album;
    index index.html;
    charset utf-8;

    # 不生成目录列表
    autoindex off;

    location / {
        try_files $uri $uri/ =404;
    }

    error_page 404 /404.html;
    location = /404.html {
        internal;
    }

    # 静态资源缓存；不影响 HTML 的更新
    location ~* \.(?:css|js|mjs|svg|jpg|jpeg|png|webp|avif|gif|ico|woff2?)$ {
        try_files $uri =404;
        expires 7d;
        add_header Cache-Control "public";
        access_log off;
    }

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
}
